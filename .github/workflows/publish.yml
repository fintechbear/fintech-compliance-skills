name: Publish to npm

# Publishes the package when you push a version tag (e.g. v1.0.0), or on manual dispatch.
#
# Auth (both supported): OIDC Trusted Publishing (no secrets; requires the package to
# exist once on npm AND a Trusted Publisher configured for this repo+workflow on
# npmjs.com), or an NPM_TOKEN repo secret. If NPM_TOKEN is set it is used; else OIDC.
#
# OIDC runtime: npm's trusted-publishing path needs a recent npm (OIDC + provenance).
# We run Node 24, which ships an npm new enough for OIDC, and LOG + ASSERT the actual
# versions at run time rather than trusting a hard-coded claim. The exact minimum
# (reported as Node >=22.14.0 / npm >=11.5.1) was NOT confirmed from a primary source in
# this cycle — see docs/development/P01.md (NEEDS_REVIEW). Node 24 clears any of those.
#
# The quality gate runs BEFORE publish on the SAME checkout; the published artifact is
# the one that passed. NOTE: configuring the Trusted Publisher on the npm account is a
# manual, out-of-band step that was NOT performed/tested here (BLOCKED).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'          # ships npm new enough for OIDC + provenance
          registry-url: 'https://registry.npmjs.org'

      - name: Log + assert OIDC-capable runtime
        shell: bash
        run: |
          echo "node: $(node --version)   npm: $(npm --version)"
          # fail early if npm is too old for OIDC trusted publishing
          node -e 'const s=require("child_process").execSync("npm --version").toString().trim();const [a,b,c]=s.split(".").map(Number);const ok=(a>11)||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error("npm "+s+" < 11.5.1 (OIDC requirement)");process.exit(1)}console.log("npm "+s+" satisfies >=11.5.1")'

      - name: Verify package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION   tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match the tag ($TAG). Bump package.json and re-tag."
            exit 1
          fi

      - name: Install dev dependencies (npm ci)
        run: npm ci

      - name: Quality gate — must pass before publish (same checkout that is published)
        run: |
          npm run verify
          npm test

      - name: Pack once and verify the artifact installs from the tarball
        shell: bash
        run: |
          TGZ=$(npm pack --silent | tail -1)
          echo "artifact: $TGZ"
          sha256sum "$TGZ"
          mkdir -p /tmp/verify && tar -xzf "$TGZ" -C /tmp/verify
          node /tmp/verify/package/installer/index.js --tool claude --target /tmp/pkgtest --home /tmp/pkgtest >/dev/null
          echo "packaged install OK ($(ls /tmp/pkgtest/.claude/skills | wc -l) skills)"
          echo "FCS_TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Publish (the same packed artifact)
        run: npm publish "$FCS_TGZ" --access public --provenance
        env:
          # Present only if you added the NPM_TOKEN secret; empty string => OIDC path.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
