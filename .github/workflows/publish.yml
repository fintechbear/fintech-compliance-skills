name: Publish to npm

# Release path. A run either PUBLISHES an approved release or stays PACK-ONLY.
#
#   * Tag push (refs/tags/vX.Y.Z): publishes only if .github/scripts/release-guard.js agrees —
#     tag == "v"+package.json version, the tagged commit is already on main, the version is not
#     yet on the registry, and the stamped source identity equals the built commit.
#   * Manual dispatch: PACK-ONLY by default. Publishing by dispatch needs mode=publish, must be
#     run on the release tag ref, and must name the exact approved commit in expected_sha. The
#     same guard applies, so a tag push and a dispatch cannot publish the same version twice.
#
# The full non-CLI Verify gate (reusable workflow) must pass on the same ref first. The package
# is packed ONCE; its SHA-256 and file inventory are retained; that same tarball is published.
# CLI tests are NOT RUN for this release by explicit scope decision.
#
# Auth: OIDC Trusted Publishing (npm >= 11.5.1, Node >= 22.14.0 per npm docs; Node 24 used) or an
# NPM_TOKEN secret. Configuring the npm package / Trusted Publisher is an account-side step that
# this workflow cannot prove; `npm pack` does not prove publish rights.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'pack-only (default) or publish'
        type: choice
        options: [pack-only, publish]
        default: pack-only
      expected_sha:
        description: 'Required for mode=publish: the full approved commit SHA being released'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every required non-CLI job (module matrix, real-PG .NET + TS harnesses, catalog, eval
  # self-tests, negative-gate proof) must pass on THIS ref before anything is packed/published.
  gate:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC trusted publishing + provenance
    steps:
      - name: Checkout (full history for the main-ancestry check)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Log + assert OIDC-capable runtime
        shell: bash
        run: |
          echo "node: $(node --version)   npm: $(npm --version)"
          node -e 'const s=require("child_process").execSync("npm --version").toString().trim();const [a,b,c]=s.split(".").map(Number);const ok=(a>11)||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error("npm "+s+" < 11.5.1 (OIDC requirement)");process.exit(1)}console.log("npm "+s+" satisfies >=11.5.1")'

      - name: Install dev dependencies (npm ci; prepare stamps the source identity)
        run: npm ci

      - name: Pack once and record artifact inventory (CLI tests explicitly NOT RUN)
        shell: bash
        run: |
          TGZ=$(npm pack --silent | tail -1)
          sha256sum "$TGZ" | tee artifact.sha256
          tar -tzf "$TGZ" > artifact-files.txt
          echo "FCS_TGZ=$TGZ" >> "$GITHUB_ENV"
          echo "CLI tests were not run for this release by explicit scope decision. Installer/doctor command flows and live Claude Code/Codex/Kiro sessions remain unverified." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the exact artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: publication-artifact
          path: |
            *.tgz
            artifact.sha256
            artifact-files.txt

      - name: Release guard (publish vs pack-only)
        id: guard
        shell: bash
        env:
          FCS_EVENT: ${{ github.event_name }}
          FCS_REF: ${{ github.ref }}
          FCS_SHA: ${{ github.sha }}
          FCS_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
          FCS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          export FCS_PKG_VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$FCS_SHA" origin/main; then export FCS_ON_MAIN=true; else export FCS_ON_MAIN=false; fi
          # registry check: E404 = not published; any other failure = cannot decide -> refuse
          set +e; OUT="$(npm view "$NAME@$FCS_PKG_VERSION" version 2>&1)"; RC=$?; set -e
          if [ $RC -eq 0 ] && [ "$OUT" = "$FCS_PKG_VERSION" ]; then export FCS_ALREADY_PUBLISHED=true
          elif echo "$OUT" | grep -q E404; then export FCS_ALREADY_PUBLISHED=false
          else echo "::error::registry state unknown: $OUT"; export FCS_ALREADY_PUBLISHED=true; fi
          export FCS_STAMPED_COMMIT="$(node -p "(()=>{try{return require('./installer/source.generated.json').commit||''}catch{return ''}})()")"
          node .github/scripts/release-guard.js

      - name: Publish (the same packed artifact)
        if: steps.guard.outputs.publish == 'true'
        run: npm publish "$FCS_TGZ" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack-only summary
        if: steps.guard.outputs.publish != 'true'
        run: |
          echo "Pack-only run - artifact built and retained, nothing was published." >> "$GITHUB_STEP_SUMMARY"
