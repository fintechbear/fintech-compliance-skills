name: Publish to npm

# Publishes the package when you push a version tag (e.g. v1.0.0),
# or when you run this workflow by hand from the Actions tab.
#
# Authentication (the workflow supports BOTH):
#   1. Trusted Publishing (OIDC) — no secrets. Requires the package to exist on npm once
#      and a Trusted Publisher configured on npmjs.com for this repo + workflow.
#   2. Automation token — set a repo secret named NPM_TOKEN (works for the first publish).
# If NPM_TOKEN is set it is used; otherwise the job relies on OIDC.
#
# The quality gate (verify + test) runs BEFORE publish on the SAME checkout, so the
# artifact that is published is the one that passed. A failing gate stops the job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # current LTS; npm >= 10 supports OIDC/provenance
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION   tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match the tag ($TAG). Bump package.json and re-tag."
            exit 1
          fi

      # Lockfile is committed: `npm ci` and let a mismatch fail (no ||install mask).
      - name: Install dev dependencies (npm ci)
        run: npm ci

      - name: Quality gate — must pass before publish (same checkout that is published)
        run: |
          npm run verify
          npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          # Present only if you added the NPM_TOKEN secret; empty string => OIDC path.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
