name: Verify

# Quality gate: runs on every push and PR. Proves the installer still produces
# resolvable, parseable, idempotent, migration-safe output, and that the .NET +
# PostgreSQL rule harness passes against a real database, before merge or release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  # Installer suite across OS + Node. 22/24 are the primary supported line; 18/20 are
  # kept this round as legacy-compatibility legs.
  installer:
    name: installer (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev dependencies (npm ci)
        run: npm ci
      - name: Structural checks
        run: npm run verify
      - name: Test suite (real YAML, migration, atomicity, packed artifact)
        run: npm test
      - name: Diagnose smoke (install then self-check reports current, exit 0)
        run: node installer/test-diagnose.js
      - name: Package contents sanity
        run: npm pack --dry-run

  # Real PostgreSQL + .NET rule harness. Uses a service container (loopback-only) and the
  # repo's .NET harness; no mocks. Also runs the shell control-flow fault test.
  harness:
    name: dotnet-postgres-harness (ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U fcs -d fcs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run rule harness against real PostgreSQL
        working-directory: examples/dotnet-postgres-harness
        env:
          PGCONN: "Host=127.0.0.1;Port=55432;Username=fcs;Password=fcs;Database=fcs"
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: dotnet run -c Release
      - name: Shell control-flow fault test (fake shims; not a real DB run)
        working-directory: examples/dotnet-postgres-harness
        run: bash test-run-sh.sh

  # Control catalog + profile integrity: schema shape, no unknown/legacy citations,
  # no broken skill_refs/test_refs, profiles explicitly declare entity role. Zero deps.
  controls:
    name: control-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate control catalog, profiles and citations
        run: node controls/validate-controls.js
      - name: Citation migration is idempotent (no drift)
        run: node controls/migrate-refusal-citations.js --check
      - name: Install self-check (source side — FCS ids resolve, no legacy citations)
        run: node installer/diagnose.js --home "$RUNNER_TEMP/no-install" --target "$RUNNER_TEMP/no-install"
