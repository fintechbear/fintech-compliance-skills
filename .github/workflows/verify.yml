name: Verify

# Quality gate: runs on every push and PR. Proves the installer still produces
# resolvable, parseable, idempotent, migration-safe output before merge or release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev dependencies
        run: npm ci || npm install
      - name: Structural checks
        run: npm run verify
      - name: Test suite (real YAML, migration, atomicity, packed artifact)
        run: npm test
      - name: Package contents sanity
        run: npm pack --dry-run
