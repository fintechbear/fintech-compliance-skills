name: Verify

# Release gate: non-CLI module/control regressions and real PostgreSQL harnesses.
# Installer/doctor/live-agent CLI tests are explicitly excluded by the owner; a green
# run MUST NOT be described as CLI compatibility or real-agent evaluation proof.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}   # F: publish.yml calls this so a release WAITS for every gate below

jobs:
  # User-approved release scope (2026-10-28): CLI tests are NOT RUN. This is a
  # module regression matrix; importing parser/config helpers does not invoke any CLI.
  cli-tests-excluded:
    name: CLI tests — NOT RUN (explicit release exclusion)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Installer, doctor and live agent CLI tests are excluded."

  modules:
    name: modules (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # One named non-CLI gate (AUD-20261102-F15). It never runs installer/verify.js,
      # installer/test.js, installer/test-diagnose.js or evals/run.js.
      - name: Non-CLI release module tests (npm run test:release:noncli)
        run: npm run test:release:noncli
      - name: Package inventory only (NOT an installed CLI smoke test)
        run: npm pack --dry-run

  # Real PostgreSQL + .NET rule harness. Uses a service container (loopback-only) and the
  # repo's .NET harness; no mocks. Also runs the shell control-flow fault test.
  harness:
    name: dotnet-postgres-harness (ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U fcs -d fcs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run rule harness against real PostgreSQL
        working-directory: examples/dotnet-postgres-harness
        env:
          PGCONN: "Host=127.0.0.1;Port=55432;Username=fcs;Password=fcs;Database=fcs"
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: dotnet run -c Release
      - name: Shell control-flow fault test (fake shims; not a real DB run)
        working-directory: examples/dotnet-postgres-harness
        run: bash test-run-sh.sh

  # Real PostgreSQL + TypeScript rule harness (transfer/ledger/refund/retention/webhook).
  # Uses a loopback-only service container; no mocks. Proves, against a real DB:
  #   - clean `npm ci` (no `npm install` fallback that would mask a bad lockfile),
  #   - a REAL `tsc --noEmit` typecheck (tsx running is NOT a typecheck),
  #   - FAILING-FIRST: the reviewed-base (654018e) sources fail the new acceptance tests,
  #   - then the fixed harness passes every module.
  ts-harness:
    name: ts-postgres-harness (ubuntu, real PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs
        ports:
          - 127.0.0.1:55443:5432
        options: >-
          --health-cmd "pg_isready -U fcs -d fcs"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGCONN: "postgresql://fcs:fcs@127.0.0.1:55443/fcs"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history so the baseline-regression can read 654018e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps (clean npm ci — NO install fallback)
        working-directory: examples/ts-postgres-harness
        run: npm ci
      - name: Real typecheck (tsc --noEmit — not tsx)
        working-directory: examples/ts-postgres-harness
        run: npx tsc --noEmit
      - name: Pure money parser test (no DB)
        working-directory: examples/ts-postgres-harness
        run: npm run test:money
      - name: Harness dependency audit (must be clean)
        working-directory: examples/ts-postgres-harness
        run: npm audit --audit-level=low
      - name: FAILING-FIRST — reviewed base (654018e) must FAIL the new acceptance tests
        working-directory: examples/ts-postgres-harness
        run: bash baseline-regression.sh 654018e847e5f91801d5dc0bdf80af7ba6be2517
      - name: Fixed harness passes every module against real PostgreSQL
        working-directory: examples/ts-postgres-harness
        run: npm start --silent

  # Control catalog + profile integrity: schema shape, no unknown/legacy citations,
  # no broken skill_refs/test_refs, profiles explicitly declare entity role. Zero deps.
  controls:
    name: control-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate control catalog, profiles and citations
        run: node controls/validate-controls.js
      - name: JSON Schema validator adversarial self-test (R11 — rejects bad input)
        run: node controls/validate-controls.selftest.js
      - name: Citation migration is idempotent (no drift)
        run: node controls/migrate-refusal-citations.js --check

  # Eval harness integrity: the deterministic grader, the codex adapter states, and the
  # config-isolation builder. All three are LLM-FREE self-tests — they prove the eval would
  # not fool itself (no auto-pass of a rubric, no silent success on a failed/empty run, no
  # personal global config leaking into a baseline-vs-candidate run). The scored agent run
  # itself needs a live agent CLI + budget and is NOT a CI job.
  evals:
    name: eval-harness-selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Deterministic grader self-test
        run: node evals/grader.js
      - name: Eval tasks validate against task.schema.json (R11/D4)
        run: node evals/validate-tasks.js
      - name: Config-isolation self-test (no global instruction leak)
        run: node evals/adapters/isolation.selftest.js

  # NEGATIVE-GATE PROOF: a gate that can never fail is not a gate. This job deliberately BREAKS
  # an input for each validator and asserts the validator REJECTS it (non-zero). The JOB passes
  # only when every validator failed on its broken input — proving the gates have teeth. Nothing
  # here is committed; every mutation is in a throwaway copy under the runner temp.
  negative-gate-proof:
    name: negative-gate-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: A broken control catalog MUST fail validate-controls
        run: |
          set -e
          work="$RUNNER_TEMP/negctl"; cp -r . "$work"; cd "$work"
          node -e 'const f="controls/catalog.json";const c=JSON.parse(require("fs").readFileSync(f));c.controls[0].review_status="green-not-an-enum";require("fs").writeFileSync(f,JSON.stringify(c))'
          if node controls/validate-controls.js; then echo "::error::validate-controls PASSED a broken catalog (gate has no teeth)"; exit 1; fi
          echo "ok: broken catalog was rejected"
      - name: A bad eval task MUST fail validate-tasks
        run: |
          set -e
          work="$RUNNER_TEMP/negtask"; cp -r . "$work"; cd "$work"
          printf '\n{"id":"BAD","category":"nope","group":"development","critical":true,"prompt":"x","grader":{"kind":"refusal"}}\n' >> evals/tasks.jsonl
          if node evals/validate-tasks.js; then echo "::error::validate-tasks PASSED a bad task (gate has no teeth)"; exit 1; fi
          echo "ok: bad eval task was rejected"
      - name: A grader that false-PASSes MUST fail its self-test
        run: |
          set -e
          work="$RUNNER_TEMP/neggrader"; cp -r . "$work"; cd "$work"
          # break the grader: make code_invariant always PASS, then its self-test must fail
          node -e 'const f="evals/grader.js";let s=require("fs").readFileSync(f,"utf8");s=s.replace("if (g.exec_probe) return runExecProbe(g.exec_probe, output);","if (g.exec_probe) return {status:\"PASS\",reason:\"BROKEN always-pass\"};");require("fs").writeFileSync(f,s)'
          if node evals/grader.js; then echo "::error::grader self-test PASSED with an always-PASS code grader (gate has no teeth)"; exit 1; fi
          echo "ok: broken grader was caught by its self-test"
      - name: Re-opening AUD-20261102-F04 (prose warn+comply) MUST fail the grader self-test
        run: |
          set -e
          work="$RUNNER_TEMP/negf04"; cp -r . "$work"; cd "$work"
          node -e 'const f="evals/grader.js";let s=require("fs").readFileSync(f,"utf8");const o="function dangerousActionFindings(text) {";if(!s.includes(o))process.exit(3);s=s.replace(o,o+" return { affirmative: [], negated: [], reported: [] };");require("fs").writeFileSync(f,s)'
          if node evals/grader.js; then echo "::error::grader self-test PASSED with the F04 prose check disabled"; exit 1; fi
          echo "ok: disabled F04 check was caught"
      - name: Re-opening AUD-20261102-F04 round 3 (first-match-only scan) MUST fail the grader self-test
        run: |
          set -e
          work="$RUNNER_TEMP/negf04r3"; cp -r . "$work"; cd "$work"
          node -e 'const f="evals/grader.js";let s=require("fs").readFileSync(f,"utf8");const o="while ((m = re.exec(t)) !== null) {";if(!s.includes(o))process.exit(3);s=s.replace(o,"if ((m = re.exec(t)) !== null) {");require("fs").writeFileSync(f,s)'
          if node evals/grader.js; then echo "::error::grader self-test PASSED with first-match-only scanning"; exit 1; fi
          echo "ok: first-match-only scanning was caught"
      # AUD-20261102-F04 round 9: refusal answers are never auto-PASSed. The earlier round-7 gates
      # (exception marker, sub-clause whitelist, safe-phrase binding, safe-phrase tail) only chose which
      # NEEDS_REVIEW reason a refusal gets, so they can no longer change a status; these gates re-open PASS.
      - name: Re-opening AUD-20261102-F04 round 9 (refusal candidate auto-PASSed) MUST fail the grader self-test
        run: |
          set -e
          work="$RUNNER_TEMP/negf04r9a"; cp -r . "$work"; cd "$work"
          node -e 'const f="evals/grader.js";let s=require("fs").readFileSync(f,"utf8");const o="status: \u0027NEEDS_REVIEW\u0027, reason: \u0027refusal candidate:";if(!s.includes(o))process.exit(3);s=s.replace(o,"status: \u0027PASS\u0027, reason: \u0027refusal candidate:");require("fs").writeFileSync(f,s)'
          if node evals/grader.js; then echo "::error::grader self-test PASSED with refusal candidates auto-PASSed"; exit 1; fi
          echo "ok: refusal candidates auto-PASSed was caught"
      - name: Re-opening AUD-20261102-F04 round 9 (any refusal PASS branch) MUST fail the grader self-test
        run: |
          set -e
          work="$RUNNER_TEMP/negf04r9b"; cp -r . "$work"; cd "$work"
          node -e 'const f="evals/grader.js";let s=require("fs").readFileSync(f,"utf8");const o="if (shipsDangerousCode(output) && quotesDangerousCodeOnlyNegated(output)) {";if(!s.includes(o))process.exit(3);s=s.replace(o,"if (looksLikeRefusal(output) && !shipsDangerousCode(output)) return { status: \"PASS\", reason: \"BROKEN\" }; if (shipsDangerousCode(output) && quotesDangerousCodeOnlyNegated(output)) {");require("fs").writeFileSync(f,s)'
          if node evals/grader.js; then echo "::error::grader self-test PASSED with an early refusal PASS branch"; exit 1; fi
          echo "ok: an early refusal PASS branch was caught"
      - name: Re-opening AUD-20261102-F01 round 3 (omitted field = declared empty) MUST fail the selector self-test
        run: |
          set -e
          work="$RUNNER_TEMP/negf01"; cp -r . "$work"; cd "$work"
          node -e 'const f="installer/profile-selector.js";let s=require("fs").readFileSync(f,"utf8");const o="const catsDeclared = Array.isArray(profile.data_categories);";if(!s.includes(o))process.exit(3);s=s.replace(o,"const catsDeclared = true;");require("fs").writeFileSync(f,s)'
          if node installer/profile-selector.selftest.js; then echo "::error::selector self-test PASSED with omitted data_categories treated as declared"; exit 1; fi
          echo "ok: omitted-field regression was caught"
      - name: Re-opening AUD-20261102-F12 (schema keyword contracts) MUST fail the release tests
        run: |
          set -e
          work="$RUNNER_TEMP/negf12"; cp -r . "$work"; cd "$work"
          node -e 'const f="controls/jsonschema.js";let s=require("fs").readFileSync(f,"utf8");const o="function checkKeywordContracts(schema, where, root, errors) {";if(!s.includes(o))process.exit(3);s=s.replace(o,o+" return;");require("fs").writeFileSync(f,s)'
          if node --test evals/release.selftest.js; then echo "::error::release tests PASSED with F12 preflight disabled"; exit 1; fi
          echo "ok: disabled F12 preflight was caught"
      - name: A publish guard that always allows MUST fail its self-test (AUD-20261102-F16)
        run: |
          set -e
          work="$RUNNER_TEMP/negf16"; cp -r . "$work"; cd "$work"
          node -e 'const f=".github/scripts/release-guard.js";let s=require("fs").readFileSync(f,"utf8");s=s.replace("function decide(f) {","function decide(f) { return { publish: true, reasons: [] };");require("fs").writeFileSync(f,s)'
          if node .github/scripts/release-guard.selftest.js; then echo "::error::guard self-test PASSED with an always-publish guard"; exit 1; fi
          echo "ok: always-publish guard was caught"

  evidence:
    name: release-evidence (CLI explicitly NOT RUN)
    needs: [modules, harness, ts-harness, controls, evals, negative-gate-proof]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the exact subject and approved test scope
        env:
          FCS_JOB_RESULTS: ${{ toJSON(needs) }}
          FCS_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process');
          fs.writeFileSync('ci-evidence.json',JSON.stringify({
            subject_sha:process.env.GITHUB_SHA,
            source_head_sha:process.env.FCS_SOURCE_HEAD,
            source_tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            run_id:process.env.GITHUB_RUN_ID,
            jobs:JSON.parse(process.env.FCS_JOB_RESULTS),
            cli_tests:{status:'NOT_RUN',reason:'explicit owner release exclusion'},
            live_agent_evaluation:'NOT_RUN', runtime_agent_isolation:'UNVERIFIED',
          },null,2));
          JS
          echo "CLI tests: NOT RUN (explicit owner exclusion). Module and real-PG checks passed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ci-evidence.json

  # AUD-20261102-F16: ONE stable aggregate check to require in branch protection. It runs even when
  # a dependency failed or was cancelled (always()), and succeeds ONLY if every required non-CLI
  # job succeeded. The excluded CLI job is not a dependency, so its skip cannot block or fake it.
  readiness:
    name: release-readiness
    if: ${{ always() }}
    needs: [modules, harness, ts-harness, controls, evals, negative-gate-proof, evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const r=JSON.parse(process.env.RESULTS);const bad=Object.entries(r).filter(([,v])=>v.result!=="success");for(const [k,v] of Object.entries(r))console.log(k+": "+v.result);if(bad.length){console.error("not ready: "+bad.map(([k,v])=>k+"="+v.result).join(", "));process.exit(1)}console.log("release-readiness: all required non-CLI jobs succeeded (CLI tests NOT RUN by scope decision)")'
