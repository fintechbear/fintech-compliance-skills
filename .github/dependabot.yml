# AUD-20261102-F16: measured dependency maintenance. Weekly, small batches; every PR must pass
# the Verify `release-readiness` check before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /examples/ts-postgres-harness
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    directory: /examples/dotnet-postgres-harness
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
